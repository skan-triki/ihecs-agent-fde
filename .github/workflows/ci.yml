name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualité (env, format, lint, types, code mort, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation (lockfile figé)
        run: pnpm install --frozen-lockfile

      - name: Intégrité des règles du cours (script officiel du template)
        # Le contrôleur ne peut pas être la copie du dépôt : un étudiant qui
        # modifierait check-integrity.mjs la ferait taire. On télécharge le
        # template officiel et on exécute SON script — la référence comme le
        # code viennent de la source de confiance.
        run: |
          curl -fsSL https://codeload.github.com/skan-triki/ihecs-agent-fde/tar.gz/refs/heads/main -o /tmp/ihecs-template.tgz
          mkdir -p /tmp/ihecs-official
          tar -xzf /tmp/ihecs-template.tgz -C /tmp/ihecs-official
          OFFICIAL="$(find /tmp/ihecs-official -name check-integrity.mjs -print -quit)"
          test -n "$OFFICIAL"
          node "$OFFICIAL"

      - name: Secrets
        run: pnpm secrets:check

      - name: Garde-fous de l'agent (contournements bloqués)
        run: pnpm guards:test

      - name: Vérification complète
        run: pnpm verify

  concept:
    name: Concept MVP validé (.concept/MVP.md)
    # Le template lui-même n'a pas de concept : le contrôle ne s'applique
    # qu'aux dépôts étudiants créés depuis le template.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Vérification du concept
        run: node scripts/check-concept.mjs

  reviews:
    name: Revues code validées (.reviews/)
    # Même logique que le job « concept » : filet de sécurité côté GitHub pour
    # les dépôts étudiants — un push fait hors de l'agent (interface web, autre
    # machine sans les hooks) ne peut pas contourner le sas des 3 relecteurs,
    # y compris un push direct sur main (événement push, pas pull_request).
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La revue porte sur le HEAD de la branche : on vérifie ce commit-là
          # (par défaut pull_request checkout le commit de fusion, qui
          # n'aurait jamais été relu ; sur push, le checkout par défaut vise
          # déjà le commit poussé).
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Revues code validées sur le commit de la PR
        run: node scripts/check-reviews.mjs

  commits:
    name: Messages de commit (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: commitlint
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
